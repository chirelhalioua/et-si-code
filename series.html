<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choisis une série ET SI ? et poursuis ta progression au Code de la route.">
  <title>Choisir une série — ET SI ?</title>

  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("etsi-theme") === "light" ? "light" : "dark";
    }
    catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
  <link rel="stylesheet" href="series.css">
  <link rel="stylesheet" href="shared-ui.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-sync.js" defer></script>
  <script src="series.js" defer></script>
</head>

<body>
  <div class="series-page">
    <header class="series-header">
      <a class="series-brand" href="index.html" aria-label="Accueil ET SI ?">
        <span>ET SI</span><b>?</b>
      </a>

      <div class="series-header-actions">
        <nav class="series-nav" aria-label="Navigation principale">
        <a href="index.html">
          <svg class="series-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"></path>
            <path d="M5.5 10.5V20h13v-9.5"></path>
            <path d="M9.5 20v-5.5h5V20"></path>
          </svg>
          <span class="series-nav-label">Accueil</span>
        </a>

        <a class="is-active" href="series.html" aria-current="page">
          <svg class="series-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path class="nav-icon-fill" d="m10 8 6 4-6 4Z"></path>
          </svg>
          <span class="series-nav-label">Jouer</span>
        </a>

        <a href="progression.html">
          <svg class="series-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V10h4v10"></path>
            <path d="M10 20V4h4v16"></path>
            <path d="M16 20v-7h4v7"></path>
            <path d="M3 20h18"></path>
          </svg>
          <span class="series-nav-label">Progression</span>
        </a>

        <a href="contact.html">
          <svg class="series-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16v12H4z"></path>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
          <span class="series-nav-label">Contact</span>
        </a>

        </nav>

        <button id="series-theme-toggle" class="series-theme-toggle" type="button" aria-label="Changer de thème">
          <span aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main>
      <section class="series-intro">
        <span>À TOI DE JOUER</span>
        <h1>Choisis ta série</h1>
        <p>Entraîne-toi à ton rythme et retrouve ton meilleur score pour chaque série.</p>
      </section>

      <section class="series-filters" aria-label="Filtrer les séries">
        <div>
          <strong>Thème</strong>
          <div id="theme-filters" class="filter-options"></div>
        </div>
        <div>
          <strong>Niveau</strong>
          <div id="level-filters" class="filter-options"></div>
        </div>
      </section>

      <section id="series-grid" class="series-grid" aria-live="polite">
        <p class="series-loading">Chargement des séries…</p>
      </section>
    </main>

    <div class="footer-road-message">
      <span class="footer-road-line" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>

      <strong>Bonne route</strong>
      <span aria-hidden="true">💛</span>
    </div>

    <footer class="site-footer">
      <div class="footer-brand">
        <a class="footer-logo-main" href="index.html" aria-label="Accueil ET SI ?">
          <span class="footer-logo-text">ET SI</span>
          <span class="footer-logo-badge">?</span>
        </a>
      </div>

      <p>Observe · Anticipe · Décide</p>

      <p class="footer-credit">
        Développé avec 💛 par
        <a
          href="https://chirelhalioua.fr/"
          target="_blank"
          rel="noopener noreferrer"
        >Chirel</a>
      </p>
    </footer>
  </div>
  <script src="back-to-top.js"></script>
</body>
</html>
